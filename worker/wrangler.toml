name = "catchup-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-06"
# Lets the Stripe SDK use its Node-compatible internals on Workers.
compatibility_flags = ["nodejs_compat"]

# Created with: npx wrangler d1 create catchup-db
# Paste the printed database_id below, then apply schema.sql (see README).
[[d1_databases]]
binding = "DB"
database_name = "catchup-db"
database_id = "PASTE_DATABASE_ID_HERE"

[vars]
# Stripe Price IDs (price_...), created in the Stripe dashboard.
# Not secrets — price ids are safe to commit.
STRIPE_PRICE_SINGLE = ""
STRIPE_PRICE_SUB = ""
# This worker's own origin, used to build Stripe's return URLs.
PUBLIC_BASE_URL = "https://catchup-proxy.george-7e2.workers.dev"

# Secrets — never put these here. Set with `npm run secret:<name>`:
#   ANTHROPIC_API_KEY      — console.anthropic.com
#   PROXY_SHARED_SECRET    — must match CATCHUP_PROXY_SECRET in the extension
#   STRIPE_SECRET_KEY      — Stripe dashboard (use the TEST key while developing)
#   STRIPE_WEBHOOK_SECRET  — shown when you create the webhook endpoint (whsec_...)
